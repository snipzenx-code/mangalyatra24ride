name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "MANGALYATRA24 RIDE" com.mangalyatra24.ride --web-dir www
          npx cap add android
          npx cap sync android

      - name: Allow location and set app icon
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application#' android/app/src/main/AndroidManifest.xml
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$d"
            dir=android/app/src/main/res/mipmap-$n
            convert icon-512.png -resize ${s}x${s} $dir/ic_launcher.png
            convert icon-512.png -resize ${s}x${s} $dir/ic_launcher_round.png
            convert icon-512.png -resize ${f}x${f} $dir/ic_launcher_foreground.png
          done

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../MANGALYATRA24-RIDE.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: MANGALYATRA24 RIDE v1.${{ github.run_number }}
          body: Download MANGALYATRA24-RIDE.apk and install it on your Android phone.
          files: MANGALYATRA24-RIDE.apk
          make_latest: true
          
